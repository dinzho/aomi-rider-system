<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專送騎手入職報名</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f0f2f5; padding: 10px; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; font-size: 20px; }
    h3 { font-size: 16px; color: #333; margin: 20px 0 10px; border-bottom: 1px solid #eee; padding-bottom: 5px;}
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    .sub-label { font-size: 12px; color: #f5222d; font-weight: normal; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
    .file-input { margin-top: 5px; font-size: 14px; }
    .btn { width: 100%; padding: 12px; background: #1890ff; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
    .btn:disabled { background: #ccc; }
    .success { text-align: center; color: #52c41a; font-size: 18px; font-weight: bold; padding: 40px 0; }
    .upload-status { font-size: 12px; color: #fa8c16; margin-top: 2px; }
    .debug-info { font-size: 10px; color: #999; margin-top: 20px; text-align: center;}
  </style>
</head>
<body>
  <div id="app">
    <div class="container" v-if="!submitted">
      <h2>專送騎手入職報名</h2>
      <form @submit.prevent="submitForm">
        
        <div class="form-group">
          <label>姓名 *</label>
          <input v-model="form.name" required>
        </div>
        <div class="form-group">
          <label>登入電話 (8位) *</label>
          <input v-model="form.phone" maxlength="8" required>
        </div>
        
        <!-- 站點選擇 -->
        <div class="form-group">
          <label>現職站點 *</label>
          <select v-model="form.station" required>
            <option value="">請選擇 (如果空白請刷新頁面)</option>
            <option v-for="s in stations" :key="s.id" :value="s.name">{{ s.name }}</option>
          </select>
          <div v-if="stations.length === 0" style="color:red; font-size:12px;">️ 站點加載失敗，請檢查網絡或聯繫管理員</div>
        </div>

        <div class="form-group">
          <label>工作類型 *</label>
          <select v-model="form.work_type" required>
            <option value="">請選擇</option>
            <option value="全職">全職</option>
            <option value="兼職">兼職</option>
          </select>
        </div>
        <div class="form-group">
          <label>身份證號碼 (8位) *</label>
          <input v-model="form.id_number" maxlength="8" required>
        </div>
        <div class="form-group">
          <label>電單車車牌號碼 *</label>
          <input v-model="form.vehicle_plate" required>
        </div>
        <div class="form-group">
          <label>工商銀行帳號 (0119開頭19位) *</label>
          <input v-model="form.bank_account" maxlength="19" required>
        </div>

        <h3>證件上傳</h3>
        <div class="form-group">
          <label>身份證正面 *</label>
          <input type="file" accept="image/*" @change="(e) => handleFile(e, 'id_card_front')" required class="file-input">
          <div class="upload-status" v-if="uploadStatus.id_card_front">{{ uploadStatus.id_card_front }}</div>
        </div>
        <div class="form-group">
          <label>身份證背面 *</label>
          <input type="file" accept="image/*" @change="(e) => handleFile(e, 'id_card_back')" required class="file-input">
        </div>
        <div class="form-group">
          <label>駕駛執照正面 *</label>
          <input type="file" accept="image/*" @change="(e) => handleFile(e, 'license_front')" required class="file-input">
        </div>
        <div class="form-group">
          <label>駕駛執照背面 *</label>
          <input type="file" accept="image/*" @change="(e) => handleFile(e, 'license_back')" required class="file-input">
        </div>
        
        <!-- 強制前置攝像頭自拍 -->
        <div class="form-group">
          <label>個人正面免冠照 * <span class="sub-label">(點擊後將打開前置攝像頭，請現場拍攝)</span></label>
          <input type="file" accept="image/*" capture="user" @change="(e) => handleFile(e, 'front_photo')" required class="file-input">
          <div class="upload-status" v-if="uploadStatus.front_photo">{{ uploadStatus.front_photo }}</div>
        </div>

        <div class="form-group">
          <label>銀行帳號證明 *</label>
          <input type="file" accept="image/*" @change="(e) => handleFile(e, 'bank_proof')" required class="file-input">
        </div>

        <h3 style="color: #f5222d;">防代培核身</h3>
        
        <!-- 強制前置攝像頭錄影 -->
        <div class="form-group">
          <label>核身視頻 * <span class="sub-label">(請正面對鏡頭，說出個人姓名)</span></label>
          <input type="file" accept="video/*" capture="user" @change="(e) => handleFile(e, 'verification_video')" required class="file-input">
          <div class="upload-status" v-if="uploadStatus.verification_video">{{ uploadStatus.verification_video }}</div>
        </div>

        <button type="submit" class="btn" :disabled="loading || isUploading">
          {{ loading ? '提交數據中...' : (isUploading ? '文件上傳中...' : '提交報名') }}
        </button>
        
        <div class="debug-info">已加載站點數：{{ stations.length }}</div>
      </form>
    </div>

    <div class="container success" v-if="submitted">
      🎉 報名成功！<br>
      <span style="font-size: 14px; color: #666; font-weight: normal;">請等待站長審核通知。</span>
    </div>
  </div>

  <script>
    const { createApp, reactive, ref, onMounted } = Vue;
    
    // ⚠️ 請務必替換為你的真實 URL 和 KEY
    const supabaseUrl = 'https://sxeumofpvoicgdfumozn.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4ZXVtb2Zwdm9pY2dkZnVtb3puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MjI0MDEsImV4cCI6MjEwNzE5ODQwMX0.BMSIbaFzJkvwDzomjKqIdcfDBLNqntYvTHyBiCnTphw';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    createApp({
      setup() {
        const form = reactive({ name: '', phone: '', station: '', work_type: '', id_number: '', vehicle_plate: '', bank_account: '' });
        const stations = ref([]);
        const loading = ref(false);
        const isUploading = ref(false);
        const submitted = ref(false);
        
        const fileUrls = reactive({
          id_card_front: '', id_card_back: '', license_front: '', license_back: '',
          front_photo: '', bank_proof: '', verification_video: ''
        });
        const uploadStatus = reactive({});

        onMounted(async () => {
          console.log('開始加載站點...');
          // 嘗試讀取站點
          const { data, error } = await supabase.from('stations').select('id, name').eq('status', 'ACTIVE');
          if (error) {
            console.error('加載站點失敗:', error);
            alert('無法加載站點列表，請檢查網絡或聯繫管理員。錯誤：' + error.message);
          } else {
            stations.value = data;
            console.log('站點加載成功:', data);
          }
        });

        const handleFile = async (event, key) => {
          const file = event.target.files[0];
          if (!file) return;

          isUploading.value = true;
          uploadStatus[key] = '上傳中...';

          const fileName = `${Date.now()}_${file.name}`;
          const { data, error } = await supabase.storage
            .from('rider-files')
            .upload(fileName, file);

          if (error) {
            uploadStatus[key] = '上傳失敗: ' + error.message;
            console.error('上傳錯誤:', error);
          } else {
            const { data: { publicUrl } } = supabase.storage.from('rider-files').getPublicUrl(fileName);
            fileUrls[key] = publicUrl;
            uploadStatus[key] = '✅ 上傳成功';
          }
          isUploading.value = false;
        };

        const submitForm = async () => {
          if (!/^6\d{7}$/.test(form.phone)) { alert('電話格式錯誤 (需8位數字)'); return; }
          if (!/^0119\d{15}$/.test(form.bank_account)) { alert('銀行帳號格式錯誤'); return; }

          for (let key in fileUrls) {
            if (!fileUrls[key]) {
              alert('請確保所有照片和視頻都上傳完成（顯示綠色對勾）');
              return;
            }
          }

          loading.value = true;
          try {
            const { error } = await supabase.from('riders').insert([{
              ...form,
              status: 'PENDING',
              ...fileUrls
            }]);

            if (error) throw error;
            submitted.value = true;
          } catch (err) {
            alert('提交失敗：' + err.message);
            console.error(err);
          } finally {
            loading.value = false;
          }
        };

        return { form, stations, loading, isUploading, submitted, submitForm, handleFile, uploadStatus };
      }
    }).mount('#app');
  </script>
</body>
</html>
